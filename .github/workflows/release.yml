name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.1.15)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim().TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Version could not be resolved." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building release version $v"

      - name: Install WiX CLI
        shell: pwsh
        run: |
          # WiX writes warnings to stderr; don't treat that as a failing step.
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed ($LASTEXITCODE)" }
          wix --version
          # UI extension is resolved by tools/Build-Installers.ps1 via NuGet DLL download.

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup ISCC.exe not found after chocolatey install."
          }

      - name: Build ZIP, MSI, and Setup.exe
        shell: pwsh
        run: .\tools\Build-Release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClientCenter-v${{ steps.ver.outputs.version }}-win-x64
          path: |
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64.msi
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.ver.outputs.version }} - Client Center
          draft: false
          generate_release_notes: true
          files: |
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-setup.exe
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64.msi
            artifacts/ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip
          body: |
            ## Client Center for Configuration Manager v${{ steps.ver.outputs.version }}

            Self-contained Windows x64 build (no separate .NET install required).

            ### Download options
            | Artifact | Use when |
            |---|---|
            | `ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-setup.exe` | Interactive wizard install (recommended for most users) |
            | `ClientCenter-v${{ steps.ver.outputs.version }}-win-x64.msi` | Enterprise / Software Center / silent install |
            | `ClientCenter-v${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip` | Portable / scripted copy without a Windows installer |

            ### Install
            **Setup.exe:** run the wizard as administrator.

            **MSI (silent):**
            ```
            msiexec /i ClientCenter-v${{ steps.ver.outputs.version }}-win-x64.msi /qn
            ```

            **Portable ZIP:** extract, then run `Install.cmd` as administrator, or launch `SCCMCliCtrWPF.exe` directly.

            ### Uninstall
            Use Apps & Features / Add or Remove Programs (EXE and MSI), or `Uninstall.cmd` from the portable ZIP.

            ### Requirements
            - Windows 10/11 x64 on the machine running Client Center
            - WinRM, ConfigMgr agent, and admin rights on target systems for remote troubleshooting

            ### Links
            - Fork: https://github.com/drummachine24/sccmclictr
            - Original project: https://github.com/rzander/sccmclictr

            Copyright (C) 2023 by Roger Zander. MS-PL license.
